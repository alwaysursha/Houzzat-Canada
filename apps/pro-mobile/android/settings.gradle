rootProject.name = 'HouzzatPro'
include ':app'
include ':react-native-webview'
project(':react-native-webview').projectDir = new File(
    rootProject.projectDir,
    '../node_modules/react-native-webview/android'
)
include ':react-native-community_datetimepicker'
project(':react-native-community_datetimepicker').projectDir = new File(
    rootProject.projectDir,
    '../node_modules/@react-native-community/datetimepicker/android'
)
include ':react-native-screens'
project(':react-native-screens').projectDir = new File(
    rootProject.projectDir,
    '../node_modules/react-native-screens/android'
)
include ':react-native-safe-area-context'
project(':react-native-safe-area-context').projectDir = new File(
    rootProject.projectDir,
    '../node_modules/react-native-safe-area-context/android'
)

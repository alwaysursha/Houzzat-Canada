name: Monitors

# Watch Property / Watch Area automatic checks.
# Hits the deployed app cron route with MONITOR_CRON_SECRET (or digest/MLS secrets).
#
# Required GitHub secrets:
#   MONITOR_CRON_URL — e.g. https://houzzat.com/api/cron/monitors
#   MONITOR_CRON_SECRET (or DIGEST_CRON_SECRET / CRON_SECRET / MLS_SYNC_SECRET)
on:
  schedule:
    # ~10 minutes — timely listing alerts without per-minute load.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      userId:
        description: "Optional single user id (QA scope)"
        required: false
        default: ""

concurrency:
  group: monitors-schedule
  cancel-in-progress: false

jobs:
  monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run monitors cron
        env:
          MONITOR_CRON_URL: ${{ secrets.MONITOR_CRON_URL }}
          MONITOR_CRON_SECRET: ${{ secrets.MONITOR_CRON_SECRET }}
          DIGEST_CRON_SECRET: ${{ secrets.DIGEST_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MLS_SYNC_SECRET: ${{ secrets.MLS_SYNC_SECRET }}
          USER_ID: ${{ github.event.inputs.userId || '' }}
        run: |
          set -euo pipefail
          URL="${MONITOR_CRON_URL:-}"
          SECRET="${MONITOR_CRON_SECRET:-${DIGEST_CRON_SECRET:-${CRON_SECRET:-${MLS_SYNC_SECRET:-}}}}"
          if [[ -z "$URL" ]]; then
            echo "Missing secret MONITOR_CRON_URL"
            exit 1
          fi
          if [[ -z "$SECRET" ]]; then
            echo "Missing MONITOR_CRON_SECRET (or DIGEST_CRON_SECRET / CRON_SECRET / MLS_SYNC_SECRET)"
            exit 1
          fi
          BODY='{}'
          if [[ -n "$USER_ID" ]]; then
            BODY=$(jq -n --arg userId "$USER_ID" '{userId:$userId}')
          fi
          echo "POST $URL"
          curl -fsS -X POST "$URL" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo

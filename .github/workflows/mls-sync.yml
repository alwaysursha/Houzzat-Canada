name: MLS Sync

# Runs PropTx → Neon sync on GitHub runners (not via Worker HTTP).
# Large syncs on Cloudflare Workers time out (503); this avoids that.
#
# Required GitHub secrets:
#   DATABASE_URL, DIRECT_URL (optional),
#   PROPTX_ENDPOINT_URL, PROPTX_BEARER_TOKEN, PROPTX_TOKEN_ID
on:
  schedule:
    # Incremental catch-up every 15 minutes (GitHub cron can drift).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      maxPages:
        description: "Max Property pages (~100 listings/page). Keep small for scheduled; raise for backfill."
        required: false
        default: "15"
      fullBackfillDays:
        description: "Days back when no Property cursor exists yet"
        required: false
        default: "7"

concurrency:
  group: mls-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run PropTx MLS sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PROPTX_ENDPOINT_URL: ${{ secrets.PROPTX_ENDPOINT_URL }}
          PROPTX_BEARER_TOKEN: ${{ secrets.PROPTX_BEARER_TOKEN }}
          PROPTX_TOKEN_ID: ${{ secrets.PROPTX_TOKEN_ID }}
          PROPTX_FEED: vow
          LISTING_PROVIDER: proptx
          MAX_PAGES: ${{ github.event.inputs.maxPages || '15' }}
          BACKFILL_DAYS: ${{ github.event.inputs.fullBackfillDays || '7' }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "Missing secret DATABASE_URL"
            exit 1
          fi
          if [[ -z "${PROPTX_BEARER_TOKEN:-}" || -z "${PROPTX_TOKEN_ID:-}" || -z "${PROPTX_ENDPOINT_URL:-}" ]]; then
            echo "Missing PropTx secrets (PROPTX_ENDPOINT_URL, PROPTX_BEARER_TOKEN, PROPTX_TOKEN_ID)"
            exit 1
          fi
          echo "Running pnpm mls:sync ${MAX_PAGES} ${BACKFILL_DAYS}"
          pnpm mls:sync "${MAX_PAGES}" "${BACKFILL_DAYS}"

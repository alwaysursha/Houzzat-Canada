name: Deploy to Cloudflare

# Production deploy after a PR is merged into main (push to main).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Build and deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NOTIFY: ${{ secrets.EMAIL_FROM_NOTIFY }}
          EMAIL_FROM_ALERTS: ${{ secrets.EMAIL_FROM_ALERTS }}
          EMAIL_ADMIN_TO: ${{ secrets.EMAIL_ADMIN_TO }}
          # Canonical production domain
          NEXTAUTH_URL: https://houzzat.com
          NEXT_PUBLIC_SITE_URL: https://houzzat.com
          # Public wa.me number (safe to bake into the client bundle at build).
          NEXT_PUBLIC_WHATSAPP_EXPERT: "16472214949"
          # Stripe — publishable key must be present at build for Embedded Checkout.
          # Secret + webhook signing secret are also needed for Worker runtime checkout/webhook.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          COMING_SOON: "0"
          # Typesense (runtime also via wrangler secrets/vars)
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_SEARCH_API_KEY: ${{ secrets.TYPESENSE_SEARCH_API_KEY }}
          TYPESENSE_COLLECTION: ${{ secrets.TYPESENSE_COLLECTION }}
          TYPESENSE_AUTOCOMPLETE: "1"
          TYPESENSE_SEARCH: "1"
          TYPESENSE_SYNC: "0"
        run: pnpm run deploy:cf

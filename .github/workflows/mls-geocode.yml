name: MLS Geocode Approximate Pins

# Repair city-centroid map pins so Map Search + Near Me work.
# Photon + Nominatim only by default — Google is hard-off to avoid Cloud bills.
on:
  # Scheduled Google-backed runs paused after unexpected Maps Platform charges.
  # Re-enable cron only with GOOGLE_MAPS_BILLING_ENABLED=1 + GCP quotas/budget.
  # schedule:
  #   - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max listings to geocode this run"
        required: false
        default: "4000"

concurrency:
  group: mls-geocode
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Geocode approximate MLS pins
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Do not inject GOOGLE_MAPS_API_KEY — keep CI on free Photon/Nominatim.
          GOOGLE_MAPS_BILLING_ENABLED: "0"
          GEOCODE_SKIP_GOOGLE: "1"
          LIMIT: ${{ github.event.inputs.limit || '4000' }}
          GEOCODE_CONCURRENCY: "4"
        run: |
          set -euo pipefail
          echo "Running pnpm mls:geocode ${LIMIT} (Google billing kill-switch ON)"
          pnpm mls:geocode "${LIMIT}"
